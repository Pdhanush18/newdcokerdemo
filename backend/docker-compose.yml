
services:

  backend:
    build:
      context: .
    container_name: exdock-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: exdock-mongodb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: