services:

  frontend:
    build:
      context: ./frontend/my-next-app
    container_name: exdock-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: exdock-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: exdock-mongodb
    ports:
    - "27018:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: